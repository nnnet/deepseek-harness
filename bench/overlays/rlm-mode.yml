# Оверлей `--patch` для профиля `bench`: воспроизводит план агента пресета
# `rlm-mode` поверх headless-хоста.
#
# ПОЧЕМУ ОВЕРЛЕЙ, А НЕ ПРЕСЕТ. Агентные пресеты монтирует ростер
# `dsh-agent-presets`, а его потребители — только `host/apiproxy` и клиентский
# UI (`packages/client/ui-agent-preset`). Headless-поверхность создаёт агента
# напрямую через ядровой реестр и ростер не спрашивает вообще, поэтому
# `dsh --profile bench` идёт на голом стандартном агенте независимо от
# `agent-presets.default` в settings.yaml. Проверено: строка `agent-presets` в
# композиции есть, каталог всё равно 25 нативных инструментов без `ipython`.
#
# Строка `agent-presets` в cordis.patch.yml профиля всё равно нужна: без неё
# ростер не смонтирован и `--patch`-оверлей не с чем сравнивать, когда дойдёт
# очередь до сверки bench против Web UI.
#
# ЧТО ЗДЕСЬ НЕ ПОВТОРЯЕТСЯ. Пресет `rlm-mode` включает стандартный пресет
# целиком, а тот контрибутит строки ИНСТРУМЕНТОВ (tool-bash, tool-fs,
# tool-jobs, ...). В headless-композиции эти строки уже есть — повторное
# монтирование дало бы столкновение. Дельта пресета над стандартным набором —
# ровно группа `dashr-kernel` и патч компакции, они и воспроизведены.
#
# ИЗВЕСТНОЕ РАСХОЖДЕНИЕ С WEB. Набор строк-инструментов у headless и web-app
# разный (web-app гасит `tool-todo` и `tool-web` и добавляет свои плагины), а
# `dsh-rlm-mode` генерирует Python-биндинги из фактически зарегистрированного
# каталога. Значит пол системного промпта в bench и в Web UI не совпадёт.
# Цикл улучшения сравнивает bench с bench, поэтому смещение допустимо, но в
# ledger оно записывается один раз замером, а не оценкой.

- insert:
    # Группа обязана нести realm: `dsh-rlm-mode` публикует сервис `rlmRuntime`,
    # и без изоляции он ушёл бы в корневой realm процесса.
    - id: dashr-kernel
      name: cordis:group
      group: true
      isolate:
        rlmRuntime: true
      config:
        - id: dsh-rlm-mode
          name: dsh-rlm-mode
          config:
            python: !!js process.env.DASHR_PYTHON || '/home/uadmin/.dsh/dashr-kernel-venv/bin/python'

# Компакция под локальную qwen3.8-27b. Значения и обоснование — те же, что в
# пресете `rlm-mode` (~/.dsh/.agent-presets/rlm-mode/agent.cordis.yml).
#
# Разница в адресате: в web-профиле хостовая строка `compaction-basic` погашена
# и работает копия внутри realm стандартного пресета, а в headless хостовая
# строка ЖИВАЯ — патчится именно она.
#
# summarizationProvider/Model намеренно не заданы: пустая пара берёт маршрут
# последнего запроса и переиспользует прогретый KV-префикс провайдера.
- id: compaction-basic
  config:
    thresholdRatio: 0.7
    retainTokens: 6144
    maxTokens: 2048
